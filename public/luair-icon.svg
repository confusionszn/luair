<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="luair-bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1326" />
      <stop offset="52%" stop-color="#070a15" />
      <stop offset="100%" stop-color="#04050b" />
    </linearGradient>
    <linearGradient id="luair-frame" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="luair-aura" cx="0.5" cy="0.5" r="0.46">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="luair-prism" x1="120" y1="112" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="luair-prism-soft" x1="392" y1="112" x2="120" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Squircle Shell -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#luair-bg)" />
  <rect x="20" y="20" width="472" height="472" rx="116" stroke="url(#luair-frame)" stroke-width="6" />

  <!-- Core Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#luair-aura)" />

  <!-- Precision Orbital Reticle Arcs -->
  <path d="M 136 176 A 144 144 0 0 1 176 136" stroke="url(#luair-prism)" stroke-width="10" stroke-linecap="round" opacity="0.55" />
  <path d="M 336 136 A 144 144 0 0 1 376 176" stroke="url(#luair-prism)" stroke-width="10" stroke-linecap="round" opacity="0.55" />
  <path d="M 376 336 A 144 144 0 0 1 336 376" stroke="url(#luair-prism)" stroke-width="10" stroke-linecap="round" opacity="0.55" />
  <path d="M 176 376 A 144 144 0 0 1 136 336" stroke="url(#luair-prism)" stroke-width="10" stroke-linecap="round" opacity="0.55" />

  <!-- Aerodynamic Geometric L-Chevron Wing -->
  <path
    d="M 164 128 L 204 128 L 204 308 L 352 308 L 324 352 L 164 352 Z"
    fill="url(#luair-prism)"
  />

  <!-- Upper-Right Converging Vector Blade -->
  <path
    d="M 356 156 L 268 244 L 296 272 L 384 184 Z"
    fill="url(#luair-prism-soft)"
  />

  <!-- Calibrated Hairline Crosshair Ticks -->
  <line x1="256" y1="88" x2="256" y2="148" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="364" x2="256" y2="424" stroke="#818cf8" stroke-width="10" stroke-linecap="round" />
  <line x1="88" y1="256" x2="148" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <line x1="364" y1="256" x2="424" y2="256" stroke="#818cf8" stroke-width="10" stroke-linecap="round" />

  <!-- Central Diamond Focal Point -->
  <polygon points="256,228 284,256 256,284 228,256" fill="#ffffff" />
  <circle cx="256" cy="256" r="9" fill="#070a15" />
</svg>
