name: Luair Cross-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Frontend & Rust Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build frontend & verify TypeScript
        run: pnpm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked || cargo test --manifest-path src-tauri/Cargo.toml

  publish-tauri:
    name: Build & Publish (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows MSVC x86_64 (.exe / .msi)
            platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
            rust_targets: "x86_64-pc-windows-msvc"
          - label: Linux x86_64 (.AppImage / .deb / .rpm)
            platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage"
            rust_targets: "x86_64-unknown-linux-gnu"
          - label: macOS Universal (.dmg / .app)
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg,app"
            rust_targets: "x86_64-apple-darwin aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (X11, Wayland, WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libxi-dev \
            libssl-dev \
            pkg-config \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build & publish Tauri artifacts + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Luair v__VERSION__"
          releaseBody: "Cross-platform release artifacts for Windows (.exe/.msi), Linux (.AppImage/.deb/.rpm), and macOS Universal (.dmg/.app) with signed Tauri Updater manifest."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
