[package]
name = "luair"
version = "2.0.1"
description = "Independent Desktop Crosshair Overlay"
authors = ["Luair"]
edition = "2021"

[lib]
name = "luair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
rusqlite = { version = "0.43", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
candle-core = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }
